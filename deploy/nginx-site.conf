# The server's own nginx: TLS and the domain, in front of the web container.
# Copy to /etc/nginx/sites-available/, set server_name, enable it, then run certbot
# (see DEPLOY.md); certbot adds the HTTPS server block and the redirect.
server {
    listen 80;
    listen [::]:80;
    server_name etf.markcirineo.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # Live price updates use WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }
}

# "upgrade" for WebSocket requests, "close" otherwise. Delete this block if another site's
# config on the server already defines $connection_upgrade (nginx -t will say so).
map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}
